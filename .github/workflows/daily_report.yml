name: Daily News Crawler

on:
  schedule:
    # 每天北京时间早上 9:00 运行 (UTC 1:00)
    - cron: '0 1 * * *'
  # 允许在 GitHub 网页上手动点击 "Run workflow" 按钮触发
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    # 设置时区为上海，确保代码中以此为准
    env:
      TZ: 'Asia/Shanghai'

    steps:
    - name: Checkout code (检出代码)
      uses: actions/checkout@v3
      
    - name: Set up Python (设置Python环境)
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies (安装依赖)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # 安装 playwright 浏览器内核及系统依赖 (必须加上 --with-deps 否则在 Ubuntu 上会报错)
        playwright install --with-deps chromium
        
    - name: Run Crawler Script (运行爬虫脚本)
      env:
        # 如果你想配置私有的钉钉 Webhook，请在 GitHub 仓库 Settings -> Secrets 中添加
        # 新命名：群1 / 群2（推荐）
        DINGTALK_GROUP1_WEBHOOK: ${{ secrets.SHIYANQUNWEBHOOK }}
        DINGTALK_GROUP1_SECRET: ${{ secrets.SHIYANQUNSECRET }}
        DINGTALK_GROUP2_WEBHOOK: ${{ secrets.DINGDINGSHANGYEWEBHOOK }}
        DINGTALK_GROUP2_SECRET: ${{ secrets.DINGDINGSHANGYESECRET }}
        DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        
        # 环境变量开关 (1=开启, 0=关闭)
        # 人力新闻
        RUN_HRLOO: "1"
        RUN_SINA: "1"
        RUN_TOPHR: "1"
        RUN_CLSSN_RLZY: "1"
        RUN_HRBRAND_NEWS: "1"
        RUN_HRVALUE_KUAI: "1"
        RUN_CAIXIN_COMPANIES: "1"
        RUN_JIEMIAN_BUSINESS: "1"
        RUN_CNFIN_DJ: "1"
        RUN_TMTPOST: "1"
        RUN_THSI_UNLISTED: "1"
        RUN_FORTUNE_CN: "1"
        RUN_YICAI_HONGGUAN: "1"
        
        # 政策法规
        RUN_MOHRSS: "1"
        RUN_CHINATAX: "1"
        RUN_HRVALUE_POLICY: "1"
        
        # 其他配置
        OUT_FILE: "daily_all.md"
        INSIGHT_HISTORY_FILE: "insight_history.jsonl"
      run: |
        python mohrss_local_news.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add daily_all.md insight_history.jsonl logs/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data files [skip ci]" && git push)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
